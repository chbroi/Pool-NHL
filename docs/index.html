<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pool des Séries NHL</title>
<link rel="stylesheet" href="./css/main.css">

 

</head>

<body data-theme="light">

  <!-- NAVBAR -->

  <div id="topBar">
  
    <div id="tabs">
      <button onclick="showTab('home')">Accueil</button>
      <button id="submitTabButton" onclick="showTab('submit')">Soumettre</button>
      <button onclick="showTab('scoring')">Système de pointage</button>
      <button onclick="showTab('results')">Résultats</button>
      <button onclick="showTab('leaderboard')">Classement</button>
      <button onclick="showTab('stats')">Stats Pool</button>
      <button id="statsNHLButton"onclick="showTab('statsNHL')">Stats NHL</button>
      <button onclick="showTab('rules')">Règlements</button>
      <button id="adminTabButton" onclick="showTab('admin')"style="display:none;">Admin</button>
      
    </div>
  
    
    <div id="rightControls">
      <button id="loginBtn">Connexion</button>
      <button id="userInfo"style="display:none;"></button>
      <button id="logoutBtn" style="display:none;">Déconnexion</button>
      <button id="themeToggle">🌙</button>
    </div>
  
  </div>


  <!-- HEADER -->
  <div id="mainHeader">
    🏒 Pool des séries éliminatoires de la LNH
  </div>
  <div id="helperMessage"></div>

  <!-- APP -->

    <div id="homeTab" class="page"></div>
    <div id="submitTab"class="page", style="display:none;"></div>
    <div id="scoringTab"class="page", style="display:none;"></div>
    <div id="resultsTab"class="page", style="display:none;"></div>
    <div id="leaderboardTab"class="page", style="display:none;"></div>
    <div id="statsTab"class="page", style="display:none;"></div>
    <div id="statsNHLTab"class="page", style="display:none;"></div>
    <div id="profileTab"class="page", style="display:none;"></div>
    <div id="adminTab"class="page", style="display:none;"></div>
  
<form id="predictionForm" style="display:none;">

  <div class="section" id="round1"></div>
  <div class="section" id="round2"></div>
  <div class="section" id="round3"></div>
  <div class="section" id="round4"></div>

  <div class="section">
    <label for="Conn_Smythe">Gagnant Conn Smythe :</label>
    <select id="Conn_Smythe" name="Conn_Smythe">
      <option value="">Choisir</option>
    </select>
  </div>

<button id="submitBtn" disabled type="button" class="actionBtn"  onclick="submitPredictions()">
  Soumettre
</button>
  <div id="missingSelections"></div>
</form>
  
  <div id="rulesModal" style="display:none;"
     class="modal">

  <div class="card">

  <button
  class="modalClose"
  id="closeRulesModal">
  ✕
</button>
  
    <h2>Participation au Pool LNH</h2>

    <p>
      En soumettant votre première prédiction :
    </p>

    <ul>
      <li>Vous confirmez avoir lu les règlements.</li>
      <li>Vous vous engagez à verser <span id="entryFeeAmount"></span> $.</li>
      <li>Vous acceptez le système de pointage.</li>
      <li>Vous acceptez les modalités du pool.</li>
    </ul>

    <label>
      <input
        type="checkbox"
        id="rulesAcceptedCheckbox">

      J'accepte les conditions de participation.
    </label>

    <br><br>

   <button
    id="viewRulesBtn"
    class="actionBtn secondary">
    Consulter les règlements
  </button>
  
  <br><br>
  
  <button 
    id="acceptModalBtn" disabled
    class="actionBtn">
    Continuer
  </button>

  </div>

</div>

  <div id="rulesTab" style="display:none;">
</div>
<script type="module" src="js/main.js"></script>

</body>
</html>
